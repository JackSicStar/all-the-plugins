name: Auto-sync fork with upstream

on:
  schedule:
    - cron: "*/60 * * * *"   # co godzinę (zmień jak chcesz)
  workflow_dispatch: {}       # możesz też odpalić ręcznie z Actions

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: xMasterX/all-the-plugins   # <— ustaw źródło, z którego chcesz się syncować
  SYNC_BRANCH: dev                          # <— którą gałąź synchronizujemy (u Ciebie dev)

jobs:
  fast_forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.SYNC_BRANCH }}

      - name: Try fast-forward merge
        id: ff
        run: |
          # jeśli mamy czysty fast-forward, zrobimy go i wypchniemy
          set -e
          git merge --ff-only upstream/${{ env.SYNC_BRANCH }} || echo "FF-NO"
          if git diff --quiet HEAD..; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push (if updated)
        if: steps.ff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin ${{ env.SYNC_BRANCH }}

  open_pr_if_conflicts:
    # uruchom gdy nie poszło FF (czyli poprzedni job nie wypchnął zmian)
    needs: fast_forward
    if: needs.fast_forward.result == 'success' && needs.fast_forward.outputs.changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.SYNC_BRANCH }}

      - name: Create update branch
        run: |
          set -e
          git checkout -B sync/upstream-${{ env.SYNC_BRANCH }}
          git merge --no-commit upstream/${{ env.SYNC_BRANCH }} || true

      - name: Create PR (when merge not fast-forward)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sync with upstream/${{ env.SYNC_BRANCH }}"
          title: "Sync: upstream → fork (${% raw %}{{ env.SYNC_BRANCH }}{% endraw %})"
          body: "Automatyczny PR: zmiany z `${{ env.UPSTREAM_REPO }}` gałąź `${{ env.SYNC_BRANCH }}`."
          branch: sync/upstream-${{ env.SYNC_BRANCH }}
          base: ${{ env.SYNC_BRANCH }}
          labels: auto-sync
