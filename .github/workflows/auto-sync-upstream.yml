name: Auto-sync fork with upstream

on:
  schedule:
    - cron: "0 */12 * * *"     # co 12 godzin (00:00 i 12:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: xMasterX/all-the-plugins  # skąd ciągniemy
  SYNC_BRANCH: dev                         # którą gałąź synchronizujemy
  PR_BRANCH: sync/upstream-dev             # gałąź, z której utworzymy PR

jobs:
  fast_forward:
    runs-on: ubuntu-latest
    outputs:
      status:  ${{ steps.ff.outputs.status }}
      changed: ${{ steps.ff.outputs.changed }}
    steps:
      - name: Checkout fork (default GITHUB_TOKEN)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0
          # UWAGA: nie podawaj "token:" z pustą wartością, bo checkout wyrzuci błąd.
          # Domyślnie użyje ${{ github.token }}.

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.SYNC_BRANCH }}

      - name: Try fast-forward merge
        id: ff
        run: |
          set -e
          # spróbuj czystego fast-forward
          if git merge --ff-only upstream/${{ env.SYNC_BRANCH }}; then
            echo "status=success" >> $GITHUB_OUTPUT
            # sprawdź czy HEAD różni się od origin/SYNC_BRANCH
            if git diff --quiet origin/${{ env.SYNC_BRANCH }}..HEAD; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true"  >> $GITHUB_OUTPUT
            fi
          else
            echo "status=fail"    >> $GITHUB_OUTPUT
            echo "changed=false"  >> $GITHUB_OUTPUT
          fi

      - name: Push (if FF succeeded and there are changes)
        if: steps.ff.outputs.status == 'success' && steps.ff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin ${{ env.SYNC_BRANCH }}

  open_pr_if_conflicts:
    # Odpal, gdy FF się nie udał
    needs: fast_forward
    if: needs.fast_forward.outputs.status == 'fail'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.SYNC_BRANCH }}

      # Stwórz PR-ową gałąź BEZPOŚREDNIO z upstream/dev i wypchnij ją,
      # żeby 'origin/PR_BRANCH' istniał w Twoim repo
      - name: Create and push PR branch from upstream
        run: |
          set -e
          git checkout -B ${{ env.PR_BRANCH }} upstream/${{ env.SYNC_BRANCH }}
          git push -f origin ${{ env.PR_BRANCH }}

      - name: Create PR (fork <- upstream)
        uses: peter-evans/create-pull-request@v6
        with:
          # create-pull-request domyślnie użyje ${{ github.token }},
          # ale podamy jawnie dla czytelności:
          token: ${{ github.token }}
          title: "Sync: upstream → fork (${{ env.SYNC_BRANCH }})"
          body:  "Automatyczny PR: zmiany z `${{ env.UPSTREAM_REPO }}` gałąź `${{ env.SYNC_BRANCH }}`."
          base:  ${{ env.SYNC_BRANCH }}
          branch: ${{ env.PR_BRANCH }}
          commit-message: "Sync with upstream/${{ env.SYNC_BRANCH }}"
          labels: auto-sync
          delete-branch: true
