name: Auto-sync fork with upstream

on:
  schedule:
    - cron: "0 */12 * * *"      # co 12 godzin (00:00 i 12:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: xMasterX/all-the-plugins   # skąd ciągniemy
  SYNC_BRANCH: dev                          # co synchronizujemy
  PR_BRANCH: sync/upstream-dev              # nazwa gałęzi do PR-a

jobs:
  fast_forward:
    runs-on: ubuntu-latest
    outputs:
      ff_changed: ${{ steps.ff.outputs.changed }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.PAT_SYNC }}   # <<< UŻYJ swojego PAT (repo + workflow)

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.SYNC_BRANCH }}

      - name: Try fast-forward merge
        id: ff
        run: |
          set -e
          if git merge --ff-only upstream/${{ env.SYNC_BRANCH }}; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Push (if updated)
        if: steps.ff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin ${{ env.SYNC_BRANCH }}

  open_pr_if_conflicts:
    needs: fast_forward
    if: needs.fast_forward.outputs.ff_changed != 'true'   # jeśli FF się nie udał
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.PAT_SYNC }}

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.SYNC_BRANCH }}

      # KLUCZ: utwórz PR-ową gałąź z upstream/dev i wypchnij ją,
      # żeby 'origin/sync/upstream-dev' istniał.
      - name: Create and push PR branch from upstream
        run: |
          set -e
          git checkout -B ${{ env.PR_BRANCH }} upstream/${{ env.SYNC_BRANCH }}
          git push -f origin ${{ env.PR_BRANCH }}

      - name: Create PR (fork <- upstream)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_SYNC }}
          title: "Sync: upstream → fork (${{ env.SYNC_BRANCH }})"
          body: "Automatyczny PR: zmiany z `${{ env.UPSTREAM_REPO }}` gałąź `${{ env.SYNC_BRANCH }}`."
          base: ${{ env.SYNC_BRANCH }}
          branch: ${{ env.PR_BRANCH }}
          commit-message: "Sync with upstream/${{ env.SYNC_BRANCH }}"
          labels: auto-sync
          delete-branch: true
